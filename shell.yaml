name: lint
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shell (bash files)
        run: shell -e SC1071 -- $(grep -rL '^#!/usr/bin/env zsh' -- *.sh)
      - name: zsh -n (zsh files)
        run: for f in *.sh; do head -1 "$f" | grep -q zsh && zsh -n "$f"; done; true